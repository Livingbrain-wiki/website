# livingbrain.wiki on Cloudflare: a Worker that only serves static assets.
# No script runs; Cloudflare serves dist/ and applies _headers and _redirects.
# Build and deploy with tools/deploy.sh, never `wrangler deploy` from a working copy.
name = "livingbrain-website"
compatibility_date = "2026-10-01"

[assets]
directory = "./dist"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

[[routes]]
pattern = "livingbrain.wiki"
custom_domain = true

[[routes]]
pattern = "www.livingbrain.wiki"
custom_domain = true
